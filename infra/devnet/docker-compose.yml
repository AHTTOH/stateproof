# Local Midnight devnet: node + indexer + proof server, for `npm run devnet:e2e`.
#   npm run devnet:up      (docker compose up -d --wait)
#   npm run devnet:e2e     (real proofs and transactions, writes docs/devnet-run.json)
#   npm run devnet:down
#
# Versions: the ledger-8 generation that matches compactc 0.31.1 / compact-runtime 0.16.0 and
# midnight-js 4.1.1 (package.json). proof-server 8.1.0 is the same image as
# infra/proof-server/docker-compose.yml. Service layout and indexer settings follow the
# compose file of JustEnough (devnet/compose.yml, Apache-2.0), which ran this same image set
# with midnight-js 4.1.1, itself taken from midnightntwrk/example-hello-world.
# The node's `dev` preset funds the genesis wallets (seed 00..01 is used by the CLI, see
# config/networks.json "undeployed"). Nothing here is secret; ports bind to 127.0.0.1 only.
services:
  proof-server:
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    image: 'midnightntwrk/indexer-standalone:4.3.3'
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      # Devnet-only placeholder (hex); the indexer requires a value.
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'devnet-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:1.0.0'
    ports:
      - '127.0.0.1:9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
