# Optional local proof server (backup to the Midnight public instance).
# Start: docker compose -f infra/proof-server/docker-compose.yml up -d
# Then set "proofServer": "http://localhost:6300" in config/networks.json.
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ['midnight-proof-server', '-v']
    environment:
      PORT: '6300'
    ports:
      - '6300:6300'
