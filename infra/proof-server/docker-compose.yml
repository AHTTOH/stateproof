# Local proof server on localhost:6300, the only proof server Lace accepts for its own
# fee (DUST) proofs. StateProof circuits are proved in the browser, not here.
# Start: docker compose -f infra/proof-server/docker-compose.yml up -d
# Without Docker: node scripts/proof-server-proxy.mjs preprod
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ['midnight-proof-server', '-v']
    environment:
      PORT: '6300'
    ports:
      - '6300:6300'
